networks:
  redis-cluster:
    driver: bridge

volumes:
  master-A-data:
  master-B-data:
  master-C-data:
  slave-A1-data:
  slave-A2-data:
  slave-B1-data:
  slave-B2-data:
  slave-C1-data:
  slave-C2-data:


services:
  master-A:
    image: redis:latest
    restart: unless-stopped
    container_name: master-A
    env_file:
      - .env
    command: redis-server --port 6379 ${CLUSTER_ARGS} --cluster-announce-port 8080
    ports:
      - "8080:6379"
    volumes:
      - master-A-data:/data
    networks:
      - redis-cluster

  master-B:
    image: redis:latest
    restart: unless-stopped
    container_name: master-B
    env_file:
      - .env
    command: redis-server --port 6379 ${CLUSTER_ARGS} --cluster-announce-port 8081
